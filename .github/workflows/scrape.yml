name: Scrape public data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scraper/**"]

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-scraper.txt
      - name: Run scraper (robots.txt-aware, 2-3 s between requests)
        run: python -m scraper.run
      - name: Show what was collected
        run: |
          wc -l data/raw/*.jsonl
          head -c 1500 data/raw/darglobal.jsonl; echo; head -c 1500 data/raw/wasalt.jsonl
      - name: Commit data snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          git diff --cached --quiet || git commit -m "data: refresh scraped snapshot" && git push
