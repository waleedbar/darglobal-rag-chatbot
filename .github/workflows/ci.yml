name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the production image (real embedding model + index)
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
        run: |
          printf '%s' "$DATA_KEY" > /tmp/data_key
          DOCKER_BUILDKIT=1 docker build --secret id=DATA_KEY,src=/tmp/data_key -t dgrag .
          rm -f /tmp/data_key
          docker images dgrag --format 'image size: {{.Size}}'
      - name: Memory profile per startup stage
        run: docker run --rm dgrag python scripts/mem_profile.py
      - name: Smoke test the container (offline LLM stand-in, 512 MB memory cap like the free host)
        run: |
          docker run -d --name app --memory=512m -e LLM_BACKEND=echo -p 7860:7860 dgrag
          for i in $(seq 1 60); do curl -sf localhost:7860/api/health && break; sleep 2; done
          echo; curl -sf localhost:7860/api/health | python -m json.tool
          for q in "When is the handover of Neptune?" "ما هي مشاريع دار جلوبال في عُمان؟" "cheapest villa in Jeddah"; do
            curl -sf -X POST localhost:7860/api/chat -H 'content-type: application/json' \
                 -d "{\"question\":\"$q\"}" | python -c "import sys,json; d=json.load(sys.stdin); print(d['lang'], [s['url'] for s in d['sources']])"
          done
          curl -sf localhost:7860/ | grep -q "property assistant"
          docker stats --no-stream --format 'memory: {{.MemUsage}}' app
          test "$(docker inspect -f '{{.State.OOMKilled}}' app)" = "false"
      - name: Retrieval quality (real embeddings, separate container so the capped app is unaffected)
        run: docker run --rm dgrag python scripts/eval_retrieval.py
