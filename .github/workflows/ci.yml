name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the production image (real embedding model + index)
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
        run: |
          printf '%s' "$DATA_KEY" > /tmp/data_key
          DOCKER_BUILDKIT=1 docker build --secret id=DATA_KEY,src=/tmp/data_key -t dgrag .
          rm -f /tmp/data_key
          docker images dgrag --format 'image size: {{.Size}}'
      - name: Memory profile per startup stage
        run: docker run --rm dgrag python scripts/mem_profile.py
      - name: Smoke test the container (offline LLM stand-in, 512 MB memory cap like the free host)
        run: |
          docker run -d --name app --memory=512m -e LLM_BACKEND=echo -p 7860:7860 dgrag
          for i in $(seq 1 60); do curl -sf localhost:7860/api/health && break; sleep 2; done
          echo; curl -sf localhost:7860/api/health | python -m json.tool
          for q in "When is the handover of Neptune?" "ما هي مشاريع دار جلوبال في عُمان؟" "cheapest villa in Jeddah"; do
            curl -sf -X POST localhost:7860/api/chat -H 'content-type: application/json' \
                 -d "{\"question\":\"$q\"}" | python -c "import sys,json; d=json.load(sys.stdin); print(d['lang'], [s['url'] for s in d['sources']])"
          done
          curl -sf localhost:7860/ | grep -q "property assistant"
          docker stats --no-stream --format 'memory: {{.MemUsage}}' app
          test "$(docker inspect -f '{{.State.OOMKilled}}' app)" = "false"
      - name: Follow-up question + metrics endpoint
        run: |
          curl -sf -X POST localhost:7860/api/chat -H 'content-type: application/json' -d '{"question":"and its handover?","history":[{"role":"user","content":"Tell me about Neptune, Interiors by Mouawad"},{"role":"assistant","content":"Neptune is a villa project in Riyadh."}]}' \
            | python -c "import sys,json; d=json.load(sys.stdin); print([s['url'] for s in d['sources']]); assert any('neptune' in s['url'] for s in d['sources'])"
          curl -sf localhost:7860/api/metrics | python -m json.tool
      - name: Retrieval evaluation + ablation (hybrid vs dense vs BM25, chunk sizes)
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
        run: |
          pip install -q cryptography -r requirements-scraper.txt
          python -m scraper.wasalt_import decrypt   # raw data only lives on this runner, never in an artifact
          docker run --rm -v "$PWD/data/raw:/app/data/raw:ro" -v "$PWD/eval:/app/eval" dgrag \
            python scripts/eval_retrieval.py --chunks 500,1000 --out eval/retrieval_results.md
          cat eval/retrieval_results.md >> "$GITHUB_STEP_SUMMARY"
