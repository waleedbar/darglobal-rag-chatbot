name: Export embedding model (dev)

# Dev helper: prepares the exact int8 embedding model used in the image and uploads it as an artifact,
# so retrieval can be iterated on locally without network access to Hugging Face.
on: workflow_dispatch

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt "onnx>=1.17"
      - env: { MODEL_CACHE: models, EMBED_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2 }
        run: |
          python -c "import os; from fastembed import TextEmbedding; TextEmbedding(os.environ['EMBED_MODEL'], cache_dir='models', lazy_load=True)"
          python scripts/quantize_model.py && python scripts/prepare_tokenizer.py
          d=$(dirname "$(find models -name model_int8.onnx | head -1)")
          mkdir -p export && cp -L "$d"/model_int8.onnx "$d"/model_int8.onnx.data "$d"/sentencepiece.bpe.model "$d"/tokenizer.json "$d"/config.json export/ 2>/dev/null || true
          ls -la export
      - uses: actions/upload-artifact@v4
        with: { name: minilm-int8, path: export/, retention-days: 3 }
