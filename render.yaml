services:
  - type: web
    name: darglobal-rag-chatbot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: RATE_LIMIT_PER_MIN
        value: "12"
      - key: KEEP_WARM_UNTIL
        value: "2026-12-10"
